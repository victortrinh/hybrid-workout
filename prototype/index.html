<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Compromised Prototype</title>
<meta name="theme-color" content="#1B3BB8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --cobalt:#1B3BB8;--cobalt-hover:#15309A;--cobalt-soft:rgba(255,255,255,.32);
  --paper:#FFFFFF;--sunk:#F4F5F8;--ink:#121212;--muted:#4D4F57;--rule:#E3E4E8;--edge:#6F727B;--link:#1B3BB8;
  --speed:#D9302A;--thr:#C76100;--hyrox:#1E8A3E;--str:#6A3FB5;--easy:#6A6E78;
  --alert:#C76100;--good:#1E8A3E;
  --pad:20px;--radius:4px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1115;--sunk:#171A20;--ink:#F1F1EE;--muted:#A6A9B1;--rule:#2A2E36;--edge:#8A8E97;--link:#9DB0FF;
  --speed:#FF6A5C;--thr:#FF9F3D;--hyrox:#4CC673;--str:#B395FF;--easy:#9BA0AA;--alert:#FF9F3D;--good:#4CC673;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1115;--sunk:#171A20;--ink:#F1F1EE;--muted:#A6A9B1;--rule:#2A2E36;--edge:#8A8E97;--link:#9DB0FF;
  --speed:#FF6A5C;--thr:#FF9F3D;--hyrox:#4CC673;--str:#B395FF;--easy:#9BA0AA;--alert:#FF9F3D;--good:#4CC673;
  color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--edge) var(--paper)}
body{background:var(--paper);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;min-height:100dvh}
::selection{background:var(--cobalt);color:#fff}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.field :focus-visible{outline-color:#fff}
input[type="checkbox"]{accent-color:var(--cobalt);width:18px;height:18px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:disabled{cursor:default}
h1,h2,h3{font-stretch:75%;font-weight:850;letter-spacing:-.01em;line-height:1.02}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* striped numerals: stripes are phased from the glyph top to the baseline by phaseStripes() */
.stripe-num{position:relative;display:inline-block;font-weight:900;font-stretch:125%;letter-spacing:-.04em;line-height:.88;white-space:nowrap}
.stripe-num::after{content:"";position:absolute;left:-2px;right:-2px;top:var(--st,0);height:var(--ch,100%);pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent 0 var(--band,11px),var(--sc,var(--cobalt)) var(--band,11px) var(--per,15px))}
.stripe-num .pt{position:relative;z-index:1}
.stripe-num .bl{display:inline-block;width:0;height:0;vertical-align:baseline}

/* shell */
.app{display:grid;min-height:100dvh;grid-template-columns:1fr}
.side{display:none}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:2px solid var(--ink);
  display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px;font-weight:700;color:var(--muted);text-decoration:none;min-width:72px;padding:4px 0}
.tabs a[aria-current="page"]{color:var(--link)}
main{padding-bottom:96px;min-width:0}
.screen[hidden]{display:none}
.brand{font-weight:800;font-stretch:125%;font-size:20px;letter-spacing:.02em}
@media (min-width:960px){
  .app{grid-template-columns:240px 1fr}
  .tabs{display:none}
  main{padding-bottom:48px}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100dvh;background:var(--cobalt);color:#fff;padding:28px 24px}
  .side nav{display:grid;gap:4px;margin-top:36px}
  .side nav a{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:10px 12px;border-radius:var(--radius)}
  .side nav a:hover{background:rgba(255,255,255,.12)}
  .side nav a[aria-current="page"]{background:#fff;color:var(--cobalt)}
  .side .mini{margin-top:auto}
  .side .mini .stripe-num{font-size:56px}
  body[data-screen="today"] .side .mini{display:none}
}

/* field */
.field{background:var(--cobalt);color:#fff;padding:16px var(--pad) 20px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;background:#fff;color:var(--cobalt);font-weight:800;display:grid;place-items:center}
.count{font-size:clamp(120px,38vw,170px);margin-top:12px}
.count-label{font-size:18px;font-weight:600;margin-top:10px}
.phases{display:grid;gap:6px;margin-top:18px}
.phase{display:grid;grid-template-columns:128px 1fr;gap:10px;align-items:center;font-size:13px;font-weight:600}
.phase.cur{font-weight:800}
.lane{position:relative;height:5px;background:var(--cobalt-soft);overflow:hidden}
.phase.cur .lane{height:8px}
.lane>i{position:absolute;inset:0 auto 0 0;background:#fff;width:0;transition:width .9s cubic-bezier(.16,1,.3,1)}
.lanefoot{display:flex;justify-content:space-between;gap:12px;font-size:15px;font-weight:600;margin-top:12px}

/* today body */
.wrap{padding:20px var(--pad) 0}
.next h1{font-size:40px}
.rx{font-size:21px;font-weight:600;margin-top:8px}
.meta{font-size:15px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:10px;margin-top:16px}
.btn{min-height:54px;border-radius:var(--radius);display:inline-grid;place-items:center;font-weight:700;font-size:17px;padding:0 20px;text-align:center}
.btn-primary{background:var(--cobalt);color:#fff;flex:1}
.btn-primary:hover{background:var(--cobalt-hover)}
.btn-line{box-shadow:inset 0 0 0 2px var(--ink)}
.btn-line:hover{background:var(--sunk)}
.sugg{margin-top:18px;padding:14px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.sugg p{font-size:17px;font-weight:600;line-height:1.3}
.sugg .why{font-size:14px;font-weight:400;color:var(--muted);margin-top:4px}
.sugg .row{display:flex;gap:20px;margin-top:10px}
.linkbtn{color:var(--link);font-weight:700;font-size:15px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;padding:8px 0}
.linkbtn.quiet{color:var(--ink);text-decoration:none}
.linkbtn:hover{text-decoration-thickness:3px}
h2.sec{font-size:26px;margin-top:22px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h2.sec small{font-stretch:100%;font-weight:500;font-size:14px;color:var(--muted);letter-spacing:0}
.week{list-style:none;margin-top:6px}
.week li{border-bottom:1px solid var(--rule)}
.week button{width:100%;display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:11px 0;text-align:left}
.week button:not(:disabled):hover .n{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.chip5{display:grid;gap:3px;color:var(--c)}
.chip5 b{height:3px;background:currentColor}
.week .n{font-size:17px;font-weight:700;display:block}
.week .d{font-size:14px;color:var(--muted)}
.week .s{font-size:14px;font-weight:700}
.week .done .n{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted)}
.tag{display:inline-block;padding:4px 8px;border-radius:var(--radius);font-size:13px;font-weight:700;background:var(--cobalt);color:#fff}
.hint{font-size:14px;color:var(--muted);margin-top:10px}
@media (min-width:960px){
  .today{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 48px;padding:0 48px 0}
  .today>.field{grid-column:1/-1;margin:0 -48px;padding:28px 48px 28px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 56px;align-items:end}
  .today>.field .top{grid-column:1/-1;justify-content:flex-end}
  .today>.field .top .brand{display:none}
  .today>.field .count{margin-top:0}
  .today>.field .phases{margin-top:0}
  .today .wrap{padding:28px 0 0}
}

/* popover */
.pop{position:absolute;right:var(--pad);top:64px;z-index:30;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:var(--radius);padding:14px;width:264px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.pop h3{font-size:18px}
.seg{display:flex;margin-top:8px;border:2px solid var(--ink);border-radius:var(--radius);overflow:hidden}
.seg button{flex:1;padding:9px 0;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pop .grp+.grp{margin-top:12px}
.pop small{display:block;margin-top:12px;font-size:12px;color:var(--muted)}

/* live */
.live{position:fixed;inset:0;z-index:40;background:var(--paper);display:flex;flex-direction:column;overflow:auto;scrollbar-color:var(--edge) var(--paper)}
.live[hidden]{display:none}
.live .field{padding-top:calc(14px + env(safe-area-inset-top))}
.lv-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lv-top h2{font-size:22px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--radius)}
.iconbtn .ico{width:26px;height:26px;stroke-width:2.4}
.lv-block{font-size:20px;font-weight:700;margin-top:14px}
.lv-speed{font-size:clamp(120px,40vw,220px);margin-top:6px}
.lv-unit{font-size:24px;font-weight:700;margin-left:8px}
.lv-row{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-top:14px}
.lv-incline b{display:block;font-size:56px;font-weight:900;font-stretch:125%;line-height:.9;letter-spacing:-.03em}
.lv-incline span{font-size:15px;font-weight:600}
.lv-time{font-size:clamp(56px,16vw,88px);font-weight:900;font-stretch:125%;letter-spacing:-.03em;line-height:.9}
.lv-line{font-size:18px;font-weight:600;margin-top:14px;min-height:24px}
.lv-lanes{display:grid;gap:12px;margin-top:4px}
.lv-lane{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:15px;font-weight:600}
.lv-lane .bar{grid-column:1/-1;height:12px;background:var(--rule);position:relative;overflow:hidden}
.lv-lane .bar i{position:absolute;inset:0 auto 0 0;background:var(--c,var(--cobalt));width:0;transition:width .9s cubic-bezier(.16,1,.3,1)}
.lv-lane.cur{font-size:17px;font-weight:800}
.lv-lane.cur .bar{height:26px}
.lv-lane .t{color:var(--muted)}
.lv-ctrl{display:flex;gap:10px;margin-top:20px}
.lv-ctrl .btn{flex:1}
.held{margin-top:16px;padding:12px 0;border-top:2px solid var(--ink);display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600;flex-wrap:wrap}
.demo{display:flex;align-items:center;gap:10px;margin:18px 0 24px;font-size:14px;color:var(--muted)}
.sheet{padding:20px var(--pad)}
.sheet h1{font-size:40px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.scale button,.areas button{min-height:46px;border-radius:var(--radius);box-shadow:inset 0 0 0 2px var(--edge);font-weight:700}
.scale button[aria-pressed="true"],.areas button[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.areas{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.areas button{padding:0 14px}
.coachline{font-weight:600;margin-top:10px}
/* strength */
.lv-target{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-top:6px}
.lv-target .stripe-num{font-size:clamp(84px,26vw,150px)}
.ex{border-bottom:1px solid var(--rule);padding:14px 0}
.ex-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex-h h3{font-size:24px}
.ex-h .tg{font-size:14px;color:var(--muted);font-weight:600}
.sets{display:grid;gap:6px;margin-top:10px}
.set{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;min-height:52px}
.set .k{font-weight:800;color:var(--muted)}
.set.cur .k{color:var(--ink)}
.load{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:700}
.step{width:44px;height:44px;border-radius:var(--radius);box-shadow:inset 0 0 0 2px var(--edge);display:grid;place-items:center}
.step .ico{width:20px;height:20px;stroke-width:2.4}
.logset{min-height:44px;padding:0 14px;border-radius:var(--radius);font-weight:700;box-shadow:inset 0 0 0 2px var(--edge)}
.set.cur .logset{background:var(--cobalt);color:#fff;box-shadow:none;min-height:52px;padding:0 18px}
.set.done .logset{box-shadow:none;color:var(--good)}
.rpe{display:flex;gap:6px;margin:2px 0 6px 34px;flex-wrap:wrap}
.rpe button{min-width:44px;min-height:40px;padding:0 8px;border-radius:var(--radius);box-shadow:inset 0 0 0 2px var(--edge);font-weight:700;font-size:14px}
.rpe button[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.rest{position:sticky;bottom:0;background:var(--cobalt);color:#fff;padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px}
.rest .bar{flex:1;height:8px;background:var(--cobalt-soft);position:relative;overflow:hidden}
.rest .bar i{position:absolute;inset:0 auto 0 0;background:#fff;transition:width 1s linear}
.rest b{font-size:26px;font-stretch:125%;font-weight:900}

/* progress */
.pg{padding:24px var(--pad) 0}
.pg-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.pg-h h1{font-size:44px}
.grid{display:grid;gap:0 40px;margin-top:14px}
.panel{border-top:2px solid var(--ink);padding:14px 0 24px;min-width:0}
.panel h2{font-size:26px}
.panel .sub{font-size:15px;color:var(--muted);margin-top:4px}
.chart-slot{margin-top:12px;min-height:120px}
.chart{display:block;overflow:visible}
.chart text{font:600 12px Archivo,sans-serif;fill:var(--muted)}
.chart .strong{fill:var(--ink);font-weight:800}
.tbl{width:100%;border-collapse:collapse;margin-top:10px;font-size:16px}
.tbl th{text-align:left;font-size:13px;color:var(--muted);font-weight:700;padding:6px 0;border-bottom:1px solid var(--rule)}
.tbl td{padding:10px 0;border-bottom:1px solid var(--rule);font-weight:600}
.tbl td:not(:first-child),.tbl th:not(:first-child){text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:13px;font-weight:600;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:6px;background:var(--c);margin-right:6px;vertical-align:middle}
.empty{margin-top:12px;padding:18px;background:var(--sunk);border-radius:var(--radius)}
.empty p{font-weight:600}
@media (min-width:960px){
  .pg{padding:36px 48px 0;max-width:1280px}
  .grid{grid-template-columns:repeat(12,minmax(0,1fr))}
  .s8{grid-column:span 8}.s4{grid-column:span 4}.s6{grid-column:span 6}.s12{grid-column:span 12}
}
/* week lanes (Plan and weekly completion) */
.wk{display:grid;grid-template-columns:40px 1fr 88px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--rule)}
.wk .no{font-weight:800;font-stretch:125%}
.wk .cells{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.wk .cells i{height:12px;box-shadow:inset 0 0 0 2px var(--c);display:block}
.wk .cells i.f{background:var(--c)}
.wk .cells i.k{height:18px}
.wk .ph{font-size:13px;color:var(--muted);font-weight:600;text-align:right}
.wk.cur{background:var(--sunk)}
.wk.cur .no{color:var(--link)}
.plan{padding:24px var(--pad) 0}
.plan h1{font-size:44px}
.phase-h{font-size:20px;margin-top:18px}
@media (min-width:960px){.plan{padding:36px 48px 0;max-width:900px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body data-screen="today">
<div class="app">
  <aside class="side" aria-label="Main">
    <span class="brand">COMPROMISED</span>
    <nav>
      <a href="#today" data-nav="today"><svg class="ico" viewBox="0 0 24 24"><path d="M3 8h18M3 12h18M3 16h18"/></svg>Today</a>
      <a href="#plan" data-nav="plan"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 10h16M10 4v16"/></svg>Plan</a>
      <a href="#progress" data-nav="progress"><svg class="ico" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Progress</a>
    </nav>
    <div class="mini" id="sideMini"></div>
  </aside>
  <main id="main">
    <section class="screen today" id="today" aria-labelledby="todayH"></section>
    <section class="screen" id="plan" hidden></section>
    <section class="screen" id="progress" hidden></section>
  </main>
  <nav class="tabs" aria-label="Main">
    <a href="#today" data-nav="today"><svg class="ico" viewBox="0 0 24 24"><path d="M3 8h18M3 12h18M3 16h18"/></svg>Today</a>
    <a href="#plan" data-nav="plan"><svg class="ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 10h16M10 4v16"/></svg>Plan</a>
    <a href="#progress" data-nav="progress"><svg class="ico" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Progress</a>
  </nav>
</div>
<div class="live" id="live" hidden role="dialog" aria-modal="true" aria-label="Live session"></div>

<script>
/* Sample data: the athlete's Program as of Wed 4 Nov 2026 (Week 3). Nothing here is real history. */
const TYPES={speed:{name:'Speed',c:'--speed'},str:{name:'Strength',c:'--str'},thr:{name:'Threshold',c:'--thr'},hyrox:{name:'HYROX',c:'--hyrox'},easy:{name:'Easy run',c:'--easy'}};
const ORDER=['speed','str','thr','hyrox','easy'];
const PHASES=[['Foundation',1,6],['5K development',7,14],['HYROX build',15,22],['Race specific',23,25],['Taper',26,27]];
const DELOAD=[4,8,12,16,22],TESTS=[2,9,17,25],SIMS=[18,21,24];
const S={theme:'system',unit:'kmh',reps:12,suggestion:'open',
  week:[{id:'speed',type:'speed',d:'5 × 3′ hard / 90″',status:'done',when:'Mon'},
    {id:'thr',type:'thr',d:'',status:'next',key:true},
    {id:'str',type:'str',d:'Squat 3 × 5 · 160 lb'},
    {id:'hyrox',type:'hyrox',d:'3 × (600 m + sled, carry)'},
    {id:'easy',type:'easy',d:'Optional · 25 min',optional:true}]};
const NB=s=>s.replace(/ × /g,' × ');
const $=(s,r=document)=>r.querySelector(s);
const spd=k=>S.unit==='kmh'?k.toFixed(1):(k/1.609344).toFixed(1);
const unit=()=>S.unit==='kmh'?'km/h':'mph';
const chip=t=>`<span class="chip5" style="--c:var(${TYPES[t].c})" aria-hidden="true"><b></b><b></b><b></b><b></b><b></b></span>`;
const stripe=(n,st='')=>`<span class="stripe-num" style="${st}">${String(n).replace('.','<span class="pt">.</span>')}<i class="bl" aria-hidden="true"></i></span>`;
const ICON={x:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',minus:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12"/></svg>',plus:'<svg class="ico" viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg>'};

/* Phase each striped numeral so whole stripes run from the glyph top to the baseline. */
const ctx=document.createElement('canvas').getContext('2d');
function phaseStripes(root=document){
  root.querySelectorAll('.stripe-num').forEach(el=>{
    const cs=getComputedStyle(el),fs=parseFloat(cs.fontSize),bl=el.querySelector('.bl');if(!bl||!fs)return;
    ctx.font=`${cs.fontWeight} ${fs}px Archivo`;const txt=el.textContent.replace('.','');
    const asc=ctx.measureText(txt).actualBoundingBoxAscent||fs*.72;
    const base=bl.getBoundingClientRect().top-el.getBoundingClientRect().top;
    const w=Math.max(2,Math.round(fs*.03)),gap=fs*.085,n=Math.max(3,Math.round((asc+w)/(gap+w))),per=(asc+w)/n;
    el.style.setProperty('--st',(base-asc).toFixed(2)+'px');el.style.setProperty('--ch',asc.toFixed(2)+'px');
    el.style.setProperty('--per',per.toFixed(3)+'px');el.style.setProperty('--band',(per-w).toFixed(3)+'px');
  })}

function nextInfo(id){return ({
  thr:{h:`Threshold, 2 × ${S.reps}′`,rx:`${spd(12.2)} ${unit()} · 1% incline`,meta:'Treadmill · 45 min · Key session this Week'},
  str:{h:'Strength, squat 3 × 5',rx:'160 lb · RPE 7',meta:'Gym · 45 min · 2′ rest between heavy sets'},
  hyrox:{h:'HYROX, 3 rounds',rx:'600 m run + sled push and pull 25 m',meta:'Gym · 45 min · about 60% of race load'},

function updateTread(){const b=L.blocks[L.i],left=Math.max(0,b.min*60-L.el),t=fmt(left).padStart(5,'0'),el=$('#lvTime');

/* Strength: the band leads with the current set; only that set's button is primary. */
function curSet(){for(let x=0;x<L.ex.length;x++)for(let s=0;s<L.ex[x].log.length;s++)if(!L.ex[x].log[s].done)return [x,s];return null}
function renderStrength(){

  const sets=L.ex.reduce((a,e)=>a+e.sets,0),dn=L.ex.reduce((a,e)=>a+e.log.filter(s=>s.done).length,0),c=curSet();
  const ce=c?L.ex[c[0]]:null,cs=c?ce.log[c[1]]:null;
  $('#live').innerHTML=NB(`<div class="field"><div class="lv-top"><h2>Strength · Week 3</h2>${closeBtn('End session')}</div>
    ${c?`<p class="lv-block">${ce.n} · Set ${c[1]+1} of ${ce.sets}</p>
      <div class="lv-target">${ce.load==null?stripe('BW'):stripe(cs.load)}<span class="lv-unit">${ce.load==null?'bodyweight':'lb'+(ce.sfx||'')} × ${ce.reps}</span></div>`
      :'<p class="lv-block">All sets logged.</p>'}
    <div class="phases" role="img" aria-label="${dn} of ${sets} sets logged">${L.ex.slice(0,5).map(e=>`<div class="lane"><i style="width:${e.log.filter(s=>s.done).length/e.sets*100}%"></i></div>`).join('')}</div>
    <p class="lv-line" aria-live="polite">${L.say||'Squat first. RPE 7 means three left in the tank.'}</p></div>
  <div class="wrap">${L.ex.map((e,xi)=>`<section class="ex"><div class="ex-h"><h3>${e.n}</h3><span class="tg">${e.sets} × ${e.reps}${e.load?' · RPE 7':''}</span></div>
    <div class="sets">${e.log.map((s,si)=>{const cur=c&&c[0]===xi&&c[1]===si;return `<div class="set ${s.done?'done':''} ${cur?'cur':''}"><span class="k">${si+1}</span>
      <span class="load">${e.load==null?'Bodyweight':`<button class="step" data-ld="${xi},${si},-1" aria-label="Lighter" ${s.done?'disabled':''}>${ICON.minus}</button>${s.load}${e.sfx||''} lb<button class="step" data-ld="${xi},${si},1" aria-label="Heavier" ${s.done?'disabled':''}>${ICON.plus}</button>`}</span>
      <button class="logset" data-set="${xi},${si}" ${s.done?'disabled':''}>${s.done?'Logged':'Log set'}</button></div>
      ${s.done?`<div class="rpe" role="group" aria-label="RPE for set ${si+1}">${[6,7,8,9,10].map(v=>`<button aria-pressed="${s.rpe===v}" data-rpe="${xi},${si},${v}">RPE ${v}</button>`).join('')}</div>`:''}`}).join('')}</div></section>`).join('')}
    <div class="actions" style="margin:18px 0 24px"><button class="btn btn-line" style="flex:1" data-finish>Finish session</button></div></div>
  ${L.rest?`<div class="rest" role="timer"><span>Rest</span><span class="bar"><i id="restBar" style="width:${L.rest.p}%"></i></span><b id="restTxt">${fmt(L.rest.left)}</b></div>`:''}`);
  phaseStripes($('#live'))}
function startRest(sec){clearInterval(tick);L.rest={left:sec,tot:sec,p:0};renderStrength();
  tick=setInterval(()=>{if(!L||!L.rest){clearInterval(tick);return}L.rest.left-=1;
    if(L.rest.left<=0){clearInterval(tick);L.rest=null;buzz();L.say='Rest over. Under the bar.';renderStrength();return}
    L.rest.p=(L.rest.tot-L.rest.left)/L.rest.tot*100;$('#restBar').style.width=L.rest.p+'%';$('#restTxt').textContent=fmt(L.rest.left)},1000)}

/* ---------- routing + events ---------- */
function route(){const id=(location.hash||'#today').slice(1);const ok=['today','plan','progress'].includes(id)?id:'today';
  document.body.dataset.screen=ok;document.querySelectorAll('.screen').forEach(s=>s.hidden=s.id!==ok);
  document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===ok)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  ({today:renderToday,plan:renderPlan,progress:renderProgress})[ok]();phaseStripes($('#sideMini'));window.scrollTo(0,0)}
function applyTheme(){const r=document.documentElement;if(S.theme==='system')r.removeAttribute('data-theme');else r.dataset.theme=S.theme;if(!$('#progress').hidden)drawCharts()}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t||t.disabled)return;const d=t.dataset;
  if(t.id==='avatar'){togglePop(t);return}
  if(d.theme){S.theme=d.theme;applyTheme();rerenderPop();return}
  if(d.unit){S.unit=d.unit;route();togglePop($('#avatar'));return}
  if(d.sugg){S.suggestion=d.sugg==='undo'?'open':d.sugg==='accept'?'accepted':'kept';S.reps=d.sugg==='accept'?10:12;renderToday();return}
  if(d.start){openLive(d.start);return}
  if(d.log){openLive(d.log);L.phase='go';finishLive();return}
  if(!L)return;
  if('close' in d){closeLive();route();return}
  if('painSome' in d){L.showPain=true;renderLive();return}
  if(d.pain){L.pain=+d.pain;renderLive();return}
  if(d.area){L.area=d.area;renderLive();return}
  if('go' in d){L.phase='go';if(L.pain>=3&&L.type==='thr')S.reps=Math.min(S.reps,10);renderLive();return}
  if('run' in d){L.run=!L.run;last=performance.now();t.textContent=L.run?'Pause':'Resume';return}
  if('skip' in d){const b=L.blocks[L.i];if(b.rep)L.ask=L.i;L.i++;L.el=0;if(L.i>=L.blocks.length){finishLive();return}renderTread();return}
  if(d.held){L.ask=null;renderTread();return}
  if(d.set){const[x,s]=d.set.split(',').map(Number);const st=L.ex[x].log[s];st.done=true;st.rpe=7;L.say=`Set ${s+1} logged at RPE 7. Change it below if that was a lie.`;startRest(L.ex[x].rest);return}
  if(d.rpe){const[x,s,v]=d.rpe.split(',').map(Number);L.ex[x].log[s].rpe=v;
    L.say=v<=7?'Three in the tank. Exactly as ordered.':v===8?'Two left. Fine. Do not get greedy.':`RPE ${v}. Same weight next time, hero.`;
    if(L.rest){t.closest('.rpe').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));$('#live .lv-line').textContent=L.say}else renderStrength();return}
  if(d.ld){const[x,s,dir]=d.ld.split(',').map(Number);const ex=L.ex[x];for(let k=s;k<ex.sets;k++)if(!ex.log[k].done)ex.log[k].load=Math.max(0,+(ex.log[k].load+dir*ex.step).toFixed(1));renderStrength();return}
  if(d.rpeAll){t.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===t));return}
  if('finish' in d){finishLive();return}
});
document.addEventListener('change',e=>{if(e.target.matches('[data-fast]')&&L)L.scale=e.target.checked?60:1});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('.pop'))closePop();else if(L){closeLive();route()}}});
function togglePop(btn){if($('.pop')){closePop();return}const p=document.createElement('div');p.className='pop';p.setAttribute('role','dialog');p.setAttribute('aria-label','Settings');
  const f=btn.closest('.field');f.style.position='relative';f.append(p);btn.setAttribute('aria-expanded','true');rerenderPop()}
function rerenderPop(){const p=$('.pop');if(!p)return;p.innerHTML=`<div class="grp"><h3>Theme</h3><div class="seg">${['system','light','dark'].map(v=>`<button aria-pressed="${S.theme===v}" data-theme="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div></div>
  <div class="grp"><h3>Treadmill units</h3><div class="seg">${[['kmh','km/h'],['mph','mph']].map(([v,l])=>`<button aria-pressed="${S.unit===v}" data-unit="${v}">${l}</button>`).join('')}</div></div>
  <small>Prototype with sample data. Nothing is saved.</small>`}
function closePop(){$('.pop')?.remove();$('#avatar')?.setAttribute('aria-expanded','false')}
let rz;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{phaseStripes();if(!$('#progress').hidden)drawCharts()},150)});
$('#sideMini').innerHTML=`${stripe('168')}<span style="display:block;margin-top:6px">days to Wed 21 April</span>`;
window.addEventListener('hashchange',route);route();
document.fonts?.ready.then(()=>phaseStripes());
/* Prototype review hook: ?live=thr|str|hyrox opens that Live session directly. */
const q=new URLSearchParams(location.search).get('live');if(q&&S.week.some(w=>w.id===q)){openLive(q);L.phase='go';renderLive();if(q==='thr'){L.el=372;updateTread()}}
</script>
</body>
