name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Local-only Wrangler: no account, no prompts, no telemetry.
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npm run check

      - name: Unit tests (Coach)
        run: npm test

      # Mock mode never ships (ADR-0005): a normal build holds none of it, and a
      # mock build holds all of it, which proves the guard looks for the right things.
      - name: Build without mocks
        run: npm run build && npm run check:no-mocks

      - name: Build in mock mode
        run: npm run build:mock && npm run check:no-mocks -- --expect

      # The browser only, no --with-deps: the runner image already has Chromium's
      # libraries, and the extra fonts and xvfb (headless, no screenshots) came from
      # an apt mirror that sometimes crawls at ~40 kB/s for ten minutes.
      - name: Cache Playwright's Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright's Chromium
        timeout-minutes: 3
        run: npx playwright install chromium

      # Builds the app, serves it from the Worker with `wrangler dev` and a fresh
      # local D1, then runs the Playwright + axe specs at 390 px and 1440 px.
      - name: End-to-end and accessibility tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
